<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Yulda — Taxi, Delivery, Marketplace & Community, Nearby</title>
    <meta
      name="description"
      content="Yulda is the all-in-one local marketplace for taxi rides, package delivery, housing, cars, jobs, services and community — connecting people across Korea and Central Asia in Uzbek, Russian, English and Korean."
    />
    <meta
      name="keywords"
      content="Yulda, taxi Korea, carpool Korea, poputi Korea, delivery Korea Uzbekistan, cargo shipping Korea Central Asia, Korea Uzbek community, 욜다, 한국 택시, 한국 중고거래, 우즈베키스탄 배송, Такси Корея, Попутка Корея, Доставка посылок Корея Узбекистан, Koreyada taksi, Koreyada ish, O'zbeklar jamoasi Koreya"
    />
    <meta name="author" content="Yulda" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://yulda.app/" />

    <!-- Language alternates (hreflang) -->
    <link rel="alternate" hreflang="en" href="https://yulda.app/" />
    <link rel="alternate" hreflang="ru" href="https://yulda.app/?lang=ru" />
    <link rel="alternate" hreflang="uz" href="https://yulda.app/?lang=uz" />
    <link rel="alternate" hreflang="ko" href="https://yulda.app/?lang=ko" />
    <link rel="alternate" hreflang="x-default" href="https://yulda.app/" />

    <!-- Favicon / app icons -->
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#FFD600" />

    <!-- Open Graph (Facebook, Naver, KakaoTalk, VK, most previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yulda" />
    <meta property="og:title" content="Yulda — Taxi, Delivery, Marketplace & Community, Nearby" />
    <meta
      property="og:description"
      content="Ride. Deliver. Work. Get things done. Yulda connects taxi, cargo, housing, marketplace and community — across Korea and Central Asia."
    />
    <meta property="og:url" content="https://yulda.app/" />
    <meta property="og:image" content="https://yulda.app/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:locale:alternate" content="uz_UZ" />
    <meta property="og:locale:alternate" content="ko_KR" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yulda — Taxi, Delivery, Marketplace & Community, Nearby" />
    <meta
      name="twitter:description"
      content="Ride. Deliver. Work. Get things done. Yulda connects taxi, cargo, housing, marketplace and community — across Korea and Central Asia."
    />
    <meta name="twitter:image" content="https://yulda.app/logo.png" />

    <!-- Search engine site verification (replace with real codes before launch) -->
    <meta name="google-site-verification" content="REPLACE_WITH_GOOGLE_SEARCH_CONSOLE_CODE" />
    <meta name="msvalidate.01" content="REPLACE_WITH_BING_WEBMASTER_CODE" />
    <meta name="naver-site-verification" content="REPLACE_WITH_NAVER_SEARCH_ADVISOR_CODE" />
    <meta name="yandex-verification" content="REPLACE_WITH_YANDEX_WEBMASTER_CODE" />

    <!-- Structured data: Organization + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://yulda.app/#organization",
            "name": "Yulda",
            "url": "https://yulda.app/",
            "logo": "https://yulda.app/logo.png",
            "sameAs": []
          },
          {
            "@type": "WebSite",
            "@id": "https://yulda.app/#website",
            "name": "Yulda",
            "url": "https://yulda.app/",
            "publisher": { "@id": "https://yulda.app/#organization" },
            "inLanguage": ["en", "ru", "uz", "ko"]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
